name: EhReader unsigned release validation

# 禁止标签自动发布；此流程只生成未签名验证产物。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unsigned:
    if: github.repository == 'haorengg12/EhReader' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v6
      - name: Build unsigned release
        run: ./gradlew spotlessCheck assembleRelease
      - uses: actions/upload-artifact@v7
        with:
          name: EhReader-release-UNSIGNED-${{ github.sha }}
          path: app/build/outputs/apk/release/*-unsigned.apk
          if-no-files-found: error
