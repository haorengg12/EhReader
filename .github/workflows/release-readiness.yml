name: EhReader Release Readiness

# 仅在 master PR 上产生必需检查，避免 develop push 的 skipped 状态混入同名检查。
on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  readiness:
    name: Release readiness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check unused release version and signing availability
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNING_CONFIGURED: ${{ secrets.EHREADER_KEYSTORE_BASE64 != '' && secrets.EHREADER_STORE_PASSWORD != '' && secrets.EHREADER_KEY_ALIAS != '' && secrets.EHREADER_KEY_PASSWORD != '' }}
        run: node scripts/release.mjs readiness

  release-build:
    name: Release build
    needs: readiness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0 ndk;29.0.14206865 cmake;3.22.1
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v6
      - name: Check release variant without signing credentials
        run: |
          node --test scripts/*.test.mjs
          ./gradlew --no-daemon spotlessCheck testReleaseUnitTest lintRelease assembleRelease
          node scripts/native-sources.mjs Release
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: EhReader-release-preview-reports-${{ github.event.pull_request.head.sha }}
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: warn
