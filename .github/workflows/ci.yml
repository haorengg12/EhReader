name: EhReader CI

on:
  push:
    branches: [dev, 'feature/**']
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'haorengg12/EhReader' && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v6
      - name: Check and build debug
        run: ./gradlew spotlessCheck assembleDebug lintDebug testDebugUnitTest
      - uses: actions/upload-artifact@v7
        with:
          name: EhReader-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
